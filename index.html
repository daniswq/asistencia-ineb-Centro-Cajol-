
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistencia Facial Inteligente</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Versión unificada y compatible de face-api -->
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 font-sans text-slate-800">

    <div class="max-w-xl mx-auto bg-white rounded-2xl shadow-lg overflow-hidden border border-slate-200">
        <!-- Encabezado -->
        <div class="bg-indigo-600 text-white p-5">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="text-xl font-bold">Control de Asistencia IA</h1>
                    <p id="fechaActual" class="text-indigo-200 text-xs mt-0.5"></p>
                </div>
                <button onclick="cambiarCamara()" class="bg-indigo-500 hover:bg-indigo-400 text-white text-xs font-medium px-3 py-2 rounded-lg transition cursor-pointer">
                    🔄 Cambiar Cámara
                </button>
            </div>
            <div id="estadoIA" class="mt-3 text-xs bg-indigo-700/70 text-indigo-100 px-3 py-1.5 rounded-lg inline-block">
                ⏳ Cargando modelos de reconocimiento facial...
            </div>
        </div>

        <div class="p-5 space-y-5">
            <!-- Visor de Cámara -->
            <div class="relative bg-slate-900 rounded-xl overflow-hidden aspect-video shadow-inner flex items-center justify-center">
                <video id="video" autoplay muted playsinline class="w-full h-full object-cover"></video>
                <canvas id="overlay" class="absolute top-0 left-0 w-full h-full pointer-events-none"></canvas>
                <div id="alertaDeteccion" class="hidden absolute top-3 left-3 bg-emerald-600/90 text-white text-xs font-semibold px-3 py-1.5 rounded-full shadow">
                    ✓ Rostro identificado
                </div>
            </div>

            <!-- Registro rápido de alumnos -->
            <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
                <h2 class="text-sm font-semibold text-slate-700 mb-2">Registrar Nuevo Alumno</h2>
                <div class="flex flex-col sm:flex-row gap-2">
                    <input type="text" id="nombreInput" placeholder="Nombre completo del alumno" 
                        class="flex-1 bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <button id="btnCapturar" onclick="registrarDesdeCamara()" disabled
                        class="bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-400 text-white text-sm font-medium px-4 py-2 rounded-lg transition cursor-pointer">
                        📸 Capturar Rostro
                    </button>
                </div>
                <div class="mt-3 pt-2 border-t border-slate-200 flex items-center justify-between text-xs text-slate-600">
                    <span>O sube una foto desde tu galería:</span>
                    <label id="labelArchivo" class="bg-white border border-indigo-300 text-indigo-600 hover:bg-indigo-50 px-3 py-1.5 rounded-lg font-medium cursor-pointer transition">
                        📁 Seleccionar Foto
                        <input type="file" id="fotoInput" accept="image/*" class="hidden" onchange="registrarDesdeArchivo(event)">
                    </label>
                </div>
            </div>

            <!-- Lista de Asistencia -->
            <div>
                <div class="flex justify-between items-center mb-2">
                    <h2 class="text-sm font-bold text-slate-700">Lista de Clase</h2>
                    <div class="flex items-center gap-2">
                        <span id="contador" class="text-xs bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-full font-semibold">
                            0 / 0 Presentes
                        </span>
                        <button onclick="reiniciarAsistencia()" class="text-xs text-slate-500 hover:text-slate-800 underline cursor-pointer">
                            Reiniciar día
                        </button>
                    </div>
                </div>

                <div class="border border-slate-200 rounded-xl overflow-hidden max-h-64 overflow-y-auto">
                    <table class="w-full text-left border-collapse">
                        <thead class="bg-slate-50 border-b border-slate-200 text-slate-500 text-xs uppercase sticky top-0">
                            <tr>
                                <th class="p-3">Alumno</th>
                                <th class="p-3">Estado</th>
                                <th class="p-3">Hora</th>
                                <th class="p-3 text-right">Acción</th>
                            </tr>
                        </thead>
                        <tbody id="cuerpoTabla" class="divide-y divide-slate-100 text-sm">
                            <tr>
                                <td colspan="4" class="p-6 text-center text-slate-400 text-xs">
                                    Aún no hay alumnos registrados. Captura o sube una foto arriba para comenzar.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Botón Exportar Excel -->
            <button onclick="exportarExcel()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-xl shadow transition flex items-center justify-center gap-2 cursor-pointer">
                📥 Descargar Hoja de Excel (.xlsx)
            </button>
        </div>
    </div>

    <script>
        const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
        const video = document.getElementById('video');
        const estadoIA = document.getElementById('estadoIA');
        const btnCapturar = document.getElementById('btnCapturar');

        let modelosCargados = false;
        let facingMode = 'environment';
        let currentStream = null;
        let intervaloDeteccion = null;

        let alumnosGuardados = JSON.parse(localStorage.getItem('asistencia_alumnos_ia')) || [];
        let asistenciaHoy = {};

        document.getElementById('fechaActual').innerText = new Date().toLocaleDateString('es-ES', {
            weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
        });

        function inicializarAsistencia() {
            alumnosGuardados.forEach(al => {
                if (!asistenciaHoy[al.id]) {
                    asistenciaHoy[al.id] = {
                        id: al.id,
                        Nombre: al.nombre,
                        Estado: 'Ausente',
                        Hora: '-'
                    };
                }
            });
            actualizarTabla();
        }

        // 1. Cargar modelos desde CDN
        window.addEventListener('DOMContentLoaded', async () => {
            inicializarAsistencia();
            iniciarCamara();

            try {
                await Promise.all([
                    faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL),
                    faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
                    faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
                ]);
                modelosCargados = true;
                btnCapturar.disabled = false;
                estadoIA.innerText = "✅ IA Lista. Apunta la cámara o sube una foto.";
                estadoIA.className = "mt-3 text-xs bg-emerald-600/80 text-white px-3 py-1.5 rounded-lg inline-block";
                iniciarReconocimiento();
            } catch (err) {
                console.error("Error cargando modelos:", err);
                estadoIA.innerText = "❌ Error al cargar modelos de IA. Revisa tu conexión a internet.";
                estadoIA.className = "mt-3 text-xs bg-rose-600 text-white px-3 py-1.5 rounded-lg inline-block";
            }
        });

        // 2. Control de Cámara
        async function iniciarCamara() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }
            try {
                currentStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: facingMode }
                });
                video.srcObject = currentStream;
            } catch (err) {
                console.warn("Cámara no disponible o sin permisos:", err);
            }
        }

        async function cambiarCamara() {
            facingMode = facingMode === 'environment' ? 'user' : 'environment';
            await iniciarCamara();
        }

        // 3. Registrar alumno desde cámara
        async function registrarDesdeCamara() {
            const nombre = document.getElementById('nombreInput').value.trim();
            if (!nombre) return alert("Escribe el nombre del alumno primero.");
            if (!modelosCargados) return alert("Espera unos segundos a que terminen de cargar los modelos de IA.");

            btnCapturar.innerText = "Analizando...";
            btnCapturar.disabled = true;

            try {
                const deteccion = await faceapi
                    .detectSingleFace(video, new faceapi.SsdMobilenetv1Options({ minConfidence: 0.4 }))
                    .withFaceLandmarks()
                    .withFaceDescriptor();

                if (!deteccion) {
                    alert("No se detectó ningún rostro claro en la cámara. Acércate un poco más o mejora la iluminación.");
                } else {
                    guardarNuevoAlumno(nombre, Array.from(deteccion.descriptor));
                    alert(`✅ Rostro de ${nombre} registrado con éxito.`);
                }
            } catch (error) {
                console.error(error);
                alert("Ocurrió un error al analizar el video de la cámara.");
            } finally {
                btnCapturar.innerText = "📸 Capturar Rostro";
                btnCapturar.disabled = false;
            }
        }

        // 4. Registrar alumno desde archivo de imagen (Corregido y optimizado para móviles)
        async function registrarDesdeArchivo(event) {
            const file = event.target.files[0];
            if (!file) return;

            const nombre = document.getElementById('nombreInput').value.trim();
            if (!nombre) {
                event.target.value = '';
                return alert("⚠️ Escribe el nombre del alumno en el cuadro de texto ANTES de seleccionar la fotografía.");
            }

            if (!modelosCargados) {
                event.target.value = '';
                return alert("⏳ Los modelos de IA aún están cargando. Espera un momento e inténtalo de nuevo.");
            }

            estadoIA.innerText = "⏳ Analizando fotografía con IA...";
            estadoIA.className = "mt-3 text-xs bg-amber-500 text-white px-3 py-1.5 rounded-lg inline-block";

            try {
                // Convertir archivo a imagen redimensionada para evitar bloqueos de memoria en celulares
                const canvasImagen = await prepararImagenParaIA(file);
                
                const deteccion = await faceapi
                    .detectSingleFace(canvasImagen, new faceapi.SsdMobilenetv1Options({ minConfidence: 0.35 }))
                    .withFaceLandmarks()
                    .withFaceDescriptor();

                if (!deteccion) {
                    alert("❌ No se detectó ningún rostro en esa foto. Asegúrate de que la cara se vea de frente y con buena luz.");
                } else {
                    guardarNuevoAlumno(nombre, Array.from(deteccion.descriptor));
                    alert(`✅ ¡Listo! Rostro de ${nombre} analizado y guardado.`);
                }
            } catch (err) {
                console.error("Error procesando foto:", err);
                alert("❌ No se pudo leer el archivo de imagen. Intenta con otra fotografía (JPG o PNG).");
            } finally {
                event.target.value = '';
                estadoIA.innerText = "✅ IA Lista. Apunta la cámara o sube una foto.";
                estadoIA.className = "mt-3 text-xs bg-emerald-600/80 text-white px-3 py-1.5 rounded-lg inline-block";
            }
        }

        // Función auxiliar para cargar y optimizar fotos pesadas de celular en un Canvas
        function prepararImagenParaIA(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const maxDim = 800; // Redimensionar a max 800px para análisis rápido y preciso
                        let width = img.width;
                        let height = img.height;

                        if (width > height && width > maxDim) {
                            height = Math.round((height * maxDim) / width);
                            width = maxDim;
                        } else if (height > maxDim) {
                            width = Math.round((width * maxDim) / height);
                            height = maxDim;
                        }

                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas);
                    };
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        function guardarNuevoAlumno(nombre, descriptorArray) {
            const id = Date.now().toString();
            alumnosGuardados.push({ id, nombre, descriptor: descriptorArray });
            localStorage.setItem('asistencia_alumnos_ia', JSON.stringify(alumnosGuardados));

            asistenciaHoy[id] = {
                id,
                Nombre: nombre,
                Estado: 'Ausente', // Inicia ausente hasta que la cámara lo vea en clase (puedes tocar para cambiar)
                Hora: '-'
            };

            document.getElementById('nombreInput').value = '';
            actualizarTabla();
            iniciarReconocimiento();
        }

        // 5. Bucle de reconocimiento facial en tiempo real
        function iniciarReconocimiento() {
            if (intervaloDeteccion) clearInterval(intervaloDeteccion);

            const canvas = document.getElementById('overlay');

            intervaloDeteccion = setInterval(async () => {
                if (!modelosCargados || video.paused || video.ended || alumnosGuardados.length === 0) return;

                const displaySize = { width: video.clientWidth, height: video.clientHeight };
                if (displaySize.width === 0) return;
                faceapi.matchDimensions(canvas, displaySize);

                const labeledDescriptors = alumnosGuardados.map(al =>
                    new faceapi.LabeledFaceDescriptors(al.id, [new Float32Array(al.descriptor)])
                );
                const faceMatcher = new faceapi.FaceMatcher(labeledDescriptors, 0.55);

                const detecciones = await faceapi
                    .detectAllFaces(video, new faceapi.SsdMobilenetv1Options({ minConfidence: 0.45 }))
                    .withFaceLandmarks()
                    .withFaceDescriptors();

                const redimensionadas = faceapi.resizeResults(detecciones, displaySize);

                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                redimensionadas.forEach(det => {
                    const match = faceMatcher.findBestMatch(det.descriptor);
                    const alumno = alumnosGuardados.find(a => a.id === match.label);
                    const etiqueta = alumno ? alumno.nombre : 'Desconocido';

                    const drawBox = new faceapi.draw.DrawBox(det.detection.box, {
                        label: etiqueta,
                        boxColor: alumno ? '#10b981' : '#ef4444'
                    });
                    drawBox.draw(canvas);

                    if (alumno && asistenciaHoy[alumno.id] && asistenciaHoy[alumno.id].Estado === 'Ausente') {
                        asistenciaHoy[alumno.id].Estado = 'Presente';
                        asistenciaHoy[alumno.id].Hora = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                        actualizarTabla();
                        mostrarAlerta(alumno.nombre);
                    }
                });
            }, 600);
        }

        function mostrarAlerta(nombre) {
            const alerta = document.getElementById('alertaDeteccion');
            alerta.innerText = `✓ Presente: ${nombre}`;
            alerta.classList.remove('hidden');
            setTimeout(() => alerta.classList.add('hidden'), 2500);
        }

        // 6. Gestión de tabla y controles manuales
        function actualizarTabla() {
            const cuerpo = document.getElementById('cuerpoTabla');
            const lista = Object.values(asistenciaHoy);

            if (lista.length === 0) {
                cuerpo.innerHTML = `<tr><td colspan="4" class="p-6 text-center text-slate-400 text-xs">Aún no hay alumnos registrados.</td></tr>`;
                document.getElementById('contador').innerText = `0 / 0 Presentes`;
                return;
            }

            cuerpo.innerHTML = '';
            let presentes = 0;

            lista.forEach(reg => {
                if (reg.Estado === 'Presente') presentes++;
                const esPresente = reg.Estado === 'Presente';

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="p-3 font-medium text-slate-800">${reg.Nombre}</td>
                    <td class="p-3">
                        <button onclick="alternarEstado('${reg.id}')" class="px-2.5 py-1 rounded-full text-xs font-semibold cursor-pointer transition ${
                            esPresente ? 'bg-emerald-100 text-emerald-700 hover:bg-emerald-200' : 'bg-rose-100 text-rose-700 hover:bg-rose-200'
                        }">
                            ${reg.Estado}
                        </button>
                    </td>
                    <td class="p-3 text-slate-500 text-xs">${reg.Hora}</td>
                    <td class="p-3 text-right">
                        <button onclick="eliminarAlumno('${reg.id}')" class="text-slate-400 hover:text-rose-600 text-xs cursor-pointer" title="Eliminar alumno">
                            🗑️
                        </button>
                    </td>
                `;
                cuerpo.appendChild(tr);
            });

            document.getElementById('contador').innerText = `${presentes} / ${lista.length} Presentes`;
        }

        function alternarEstado(id) {
            if (!asistenciaHoy[id]) return;
            if (asistenciaHoy[id].Estado === 'Ausente') {
                asistenciaHoy[id].Estado = 'Presente';
                asistenciaHoy[id].Hora = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            } else {
                asistenciaHoy[id].Estado = 'Ausente';
                asistenciaHoy[id].Hora = '-';
            }
            actualizarTabla();
        }

        function reiniciarAsistencia() {
            Object.keys(asistenciaHoy).forEach(id => {
                asistenciaHoy[id].Estado = 'Ausente';
                asistenciaHoy[id].Hora = '-';
            });
            actualizarTabla();
        }

        function eliminarAlumno(id) {
            if (!confirm("¿Eliminar este alumno de la base de datos?")) return;
            alumnosGuardados = alumnosGuardados.filter(a => a.id !== id);
            localStorage.setItem('asistencia_alumnos_ia', JSON.stringify(alumnosGuardados));
            delete asistenciaHoy[id];
            actualizarTabla();
        }

        // 7. Exportar a Excel
        function exportarExcel() {
            const lista = Object.values(asistenciaHoy);
            if (lista.length === 0) return alert("No hay alumnos en la lista para exportar.");

            const datosExcel = lista.map(({ Nombre, Estado, Hora }) => ({
                Alumno: Nombre,
                Estado: Estado,
                Hora_Registro: Hora,
                Fecha: new Date().toLocaleDateString('es-ES')
            }));

            const worksheet = XLSX.utils.json_to_sheet(datosExcel);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Asistencia");

            const fechaArchivo = new Date().toISOString().slice(0, 10);
            XLSX.writeFile(workbook, `Asistencia_${fechaArchivo}.xlsx`);
        }
    </script>
</body>
</html>
